server:
  port: 8080

spring:
  application:
    name: anml

  datasource:
    url: jdbc:postgresql://localhost:5433/anml_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: animal-client
            client-secret: URTaSvSsNlypca2ydkawtxwyeWC1j8pg
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
            issuer-uri: http://localhost:8081/realms/animal-realm
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/animal-realm
  quartz:
    job-store-type: jdbc
    overwrite-existing-jobs: true
    wait-for-jobs-to-complete-on-shutdown: true
    jdbc:
      initialize-schema: never
    properties:
      org:
        quartz:
          scheduler:
            instanceName: AnmlQuartzScheduler
            instanceId: AUTO
          jobStore:
            driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
            tablePrefix: QRTZ_
            useProperties: false
          threadPool:
            threadCount: 5